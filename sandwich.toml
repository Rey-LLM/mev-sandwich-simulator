# sandwich.toml: центральный файл настроек симулятора MEV-сэндвичей.
#
# Приоритет, от низшего к высшему: встроенный пресет режима < этот файл
# < $MEV_SIM_WORKERS (только число процессов) < --set ТАБЛИЦА.КЛЮЧ=ЗНАЧЕНИЕ < флаги.
#
#   python -m simulator --show-config      показать действующие настройки
#   python -m simulator --sync-config      добавить ключи, появившиеся в новых версиях
#   python -m simulator --save-config ...  записать значения из командной строки в файл
#   python -m simulator --gui              редактировать этот файл в браузере

[meta]
schema_version = 1                       # версия разметки (записывается симулятором)

[run]
mode = "moderate"                        # режим запуска: moderate | brutal | max
seed = 7                                 # зерно всех детерминированных потоков
native_token = "WETH"                    # токен, в котором считаются прибыль и газ
default_tolerance_bps = 50               # допуск проскальзывания (bps) для транзакций без своего допуска

[parallel]
start_method = "spawn"                   # способ запуска процессов multiprocessing
parallel_threshold = 4                   # пакеты меньше этого размера выполняются в текущем процессе

[gas]
base_fee_wei = 20_000_000_000            # начальная базовая комиссия (wei)
priority_fee_wei = 2_000_000_000         # приоритетная комиссия сёрчера (wei)
block_gas_limit = 30_000_000             # лимит газа блока, приводится к [21000, 30000000]

[search]
max_frontrun_bps = 2000                  # наибольший фронтран в bps от входного резерва

[pbs]
builder_margin_bps = 500                 # доля стоимости блока, которую оставляет билдер (bps)
bribe_bps = 8000                         # доля прибыли сэндвича, выплачиваемая билдеру (bps)

[private_relay]
mev_share_refund_bps = 9000              # возврат пользователям через MEV-Share (bps)

[rl]
regime = "volatile"                      # рыночный режим RL: calm | volatile | extreme

[trace]
enabled = false                          # записывать трассу транзакций каждого запечатанного блока
path = ""                                # файл трассировки (пусто = stderr)

[audit]
enabled = true                           # запускать проверку целостности перед симуляцией
fail_on = "error"                        # минимальная серьёзность находки, блокирующая запуск: error | warning | info
code_scan = true                         # включить сканирование исходного кода
tick_samples = 256                       # число тиков в проверках арифметики тиков

[patterns]
store = ""                               # каталог хранилища MEV-паттернов (пусто = только синтетические эталонные паттерны)
max_storage_gb = 500                     # предел объёма хранилища паттернов в ГиБ (сегменты + индекс)
segment_mb = 64                          # размер ротации файла-сегмента паттернов (МиБ)
cache_mb = 256                           # бюджет LRU-кэша декодированных паттернов (МиБ)

[ui]
language = "ru"                          # язык интерфейса, журналов и HTML-графиков: ru | en

# Умеренное сканирование: телеметрия только для чтения, аудит лимита газа, пассивный поток данных (50-60% ядер CPU).
[modes.moderate]
workers = 0                              # рабочие процессы (0 = автоматически по политике CPU)
cpu_policy = "capped"                    # capped = 50-60% ядер CPU, full = 100% логических ядер
blocks = 1                               # число симулируемых блоков (слотов)
txs_per_block = 32                       # ожидающих транзакций на блок
frontrun_grid = 0                        # размеров фронтрана, перебираемых для каждой жертвы
refine_iterations = 0                    # шагов уточнения тернарным поиском
fuzz_iterations = 128                    # свопов фаззинга инвариантов
layout_fuzz_iterations = 0               # раскладок блока, фаззимых на слот
private_flow_bps = 0                     # доля пользовательских свопов, отправляемых в приватный релей (bps)
router_max_hops = 3                      # самый длинный маршрут / цикл (1-6)
rl_rounds = 0                            # раундов параллельной итерации политики
rl_steps_per_shard = 48                  # шагов RL на шард и раунд
rl_eval_steps = 96                       # шагов жадной оценки RL
shard_density = 1                        # множитель всех фиксированных чисел шардов / чанков
pg_paths = 0                             # путей градиента политики, фаззимых параллельно
pg_path_steps = 16                       # шагов на путь градиента политики
pg_batch = 32                            # путей на задачу рабочего процесса
agent_bots = 0                           # ИИ-ботов-конкурентов в поколении (0 = выкл.)
agent_generations = 2                    # поколений фабрики ИИ (синтез, развёртывание, дообучение)
agent_heat_size = 8                      # ИИ-ботов в заезде арены (одна задача процесса)
agent_heat_slots = 12                    # блоков, симулируемых в каждом заезде арены
pattern_seed_bps = 0                     # доля ИИ-ботов поколения 0 из MEV-паттернов (bps, 0 = выкл.)
pattern_limit = 4096                     # самых тяжёлых MEV-паттернов, загружаемых в фабрику ИИ
pattern_synthetic = 0                    # сгенерированных эталонных паттернов, если хранилище не задано
custom_bots = 0                          # чертежей пользовательских ботов от ИИ в поколении (0 = выкл.)
custom_generations = 2                   # поколений конструктора (проектирование, компиляция, оценка, дообучение)

# Жёсткая агрессивная симуляция: многоблочный поиск сэндвичей на ограниченном пуле процессов (50-60% ядер CPU).
[modes.brutal]
workers = 0                              # рабочие процессы (0 = автоматически по политике CPU)
cpu_policy = "capped"                    # capped = 50-60% ядер CPU, full = 100% логических ядер
blocks = 6                               # число симулируемых блоков (слотов)
txs_per_block = 48                       # ожидающих транзакций на блок
frontrun_grid = 48                       # размеров фронтрана, перебираемых для каждой жертвы
refine_iterations = 24                   # шагов уточнения тернарным поиском
fuzz_iterations = 2000                   # свопов фаззинга инвариантов
layout_fuzz_iterations = 2048            # раскладок блока, фаззимых на слот
private_flow_bps = 3000                  # доля пользовательских свопов, отправляемых в приватный релей (bps)
router_max_hops = 4                      # самый длинный маршрут / цикл (1-6)
rl_rounds = 3                            # раундов параллельной итерации политики
rl_steps_per_shard = 64                  # шагов RL на шард и раунд
rl_eval_steps = 128                      # шагов жадной оценки RL
shard_density = 1                        # множитель всех фиксированных чисел шардов / чанков
pg_paths = 0                             # путей градиента политики, фаззимых параллельно
pg_path_steps = 16                       # шагов на путь градиента политики
pg_batch = 32                            # путей на задачу рабочего процесса
agent_bots = 0                           # ИИ-ботов-конкурентов в поколении (0 = выкл.)
agent_generations = 2                    # поколений фабрики ИИ (синтез, развёртывание, дообучение)
agent_heat_size = 8                      # ИИ-ботов в заезде арены (одна задача процесса)
agent_heat_slots = 12                    # блоков, симулируемых в каждом заезде арены
pattern_seed_bps = 0                     # доля ИИ-ботов поколения 0 из MEV-паттернов (bps, 0 = выкл.)
pattern_limit = 4096                     # самых тяжёлых MEV-паттернов, загружаемых в фабрику ИИ
pattern_synthetic = 0                    # сгенерированных эталонных паттернов, если хранилище не задано
custom_bots = 0                          # чертежей пользовательских ботов от ИИ в поколении (0 = выкл.)
custom_generations = 2                   # поколений конструктора (проектирование, компиляция, оценка, дообучение)

# MAX Brutal Simulation: без ограничения CPU (100% логических ядер), плотные шарды, фаззинг путей градиента политики, фабрика ИИ-агентов.
[modes.max]
workers = 0                              # рабочие процессы (0 = автоматически по политике CPU)
cpu_policy = "full"                      # capped = 50-60% ядер CPU, full = 100% логических ядер
blocks = 8                               # число симулируемых блоков (слотов)
txs_per_block = 64                       # ожидающих транзакций на блок
frontrun_grid = 64                       # размеров фронтрана, перебираемых для каждой жертвы
refine_iterations = 32                   # шагов уточнения тернарным поиском
fuzz_iterations = 8192                   # свопов фаззинга инвариантов
layout_fuzz_iterations = 4096            # раскладок блока, фаззимых на слот
private_flow_bps = 3000                  # доля пользовательских свопов, отправляемых в приватный релей (bps)
router_max_hops = 5                      # самый длинный маршрут / цикл (1-6)
rl_rounds = 4                            # раундов параллельной итерации политики
rl_steps_per_shard = 64                  # шагов RL на шард и раунд
rl_eval_steps = 256                      # шагов жадной оценки RL
shard_density = 16                       # множитель всех фиксированных чисел шардов / чанков
pg_paths = 4096                          # путей градиента политики, фаззимых параллельно
pg_path_steps = 16                       # шагов на путь градиента политики
pg_batch = 32                            # путей на задачу рабочего процесса
agent_bots = 512                         # ИИ-ботов-конкурентов в поколении (0 = выкл.)
agent_generations = 6                    # поколений фабрики ИИ (синтез, развёртывание, дообучение)
agent_heat_size = 8                      # ИИ-ботов в заезде арены (одна задача процесса)
agent_heat_slots = 16                    # блоков, симулируемых в каждом заезде арены
pattern_seed_bps = 5000                  # доля ИИ-ботов поколения 0 из MEV-паттернов (bps, 0 = выкл.)
pattern_limit = 4096                     # самых тяжёлых MEV-паттернов, загружаемых в фабрику ИИ
pattern_synthetic = 3072                 # сгенерированных эталонных паттернов, если хранилище не задано
custom_bots = 128                        # чертежей пользовательских ботов от ИИ в поколении (0 = выкл.)
custom_generations = 4                   # поколений конструктора (проектирование, компиляция, оценка, дообучение)
