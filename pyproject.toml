[project]
name = "mev-sandwich-simulator"
version = "0.17.0"
description = "Sandwich attack detector for real Ethereum blocks, pre-trade sandwich check and offline MEV simulator"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
